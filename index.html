<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Currency Converter</title>

  <!-- CDN REACT -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <!-- CDN React DOM - connects React to the HTML page -->
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel - translates JSX so the browser understands -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

</head>

<body>

  <!-- React will inject the entire app inside this div -->
  <div id="root"></div>

  <!-- React code goes here -->
  <script type="text/babel">

    // components below:
function InputSection(props) {
  return (
    <div>
      <label>{props.label}</label>
      <input type="number" placeholder={props.placeholder} />
    </div>
  );
}

function ConvertButton(props) {
  return (
    <button>{props.label}</button>
  );
}

function ResultDisplay(props) {
  return (
    <div>
      <label>{props.label}</label>
      <input type="number" readOnly placeholder="Result will appear here" />
    </div>
  );
}

function App() {
  return (
    <div>
      <h1>Currency Converter</h1>
      <InputSection label="Amount to convert" placeholder="Enter amount to convert" />
      <InputSection label="Exchange rate" placeholder="Enter exchange rate" />
      <ConvertButton label="Convert" />
      <ResultDisplay label="Result" />
    </div>
  );
}
    
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);

  </script>

</body>
</html>
